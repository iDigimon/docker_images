name: Ubuntu Build

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron:  '30 5 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY }}
  USERNAME: ${{ secrets.USERNAME }}
  NAMESPACE: ${{ secrets.NAMESPACE }}
  # github.repository as <account>/<repo>
  IMAGE_NAME: ubuntu


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request' && env.REGISTRY != ''
        uses: aliyun/acr-login@1840dbaffb41a83ec8ce19d5c1088e8776eb9bc3 # v2.0.3
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Log in to Tencent Cloud TCR
        if: github.event_name != 'pull_request' && vars.TCR_REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ vars.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ubuntu
          file: ./ubuntu/Dockerfile.ubuntu
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.TCR_REGISTRY != '' && format('{0}/{1}/{2}:latest', vars.TCR_REGISTRY, vars.TCR_NAMESPACE, env.IMAGE_NAME) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Build and push Docker image 22.04
        uses: docker/build-push-action@v7
        with:
          context: ./ubuntu
          file: ./ubuntu/Dockerfile.ubuntu.22.04
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:22.04
            ${{ vars.TCR_REGISTRY != '' && format('{0}/{1}/{2}:22.04', vars.TCR_REGISTRY, vars.TCR_NAMESPACE, env.IMAGE_NAME) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
