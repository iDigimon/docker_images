name: Python Build

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/python.yml'
      - 'Dockerfile.python*'
      - 'requirements.python-*.txt'
      - 'requirements.txt'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Python ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: python-${{ matrix.tag }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: '3.9'
            dockerfile: Dockerfile.python-3.9
            imports: gunicorn httpx2 uvicorn
            keep_rollback: true
          - tag: '3.10'
            dockerfile: Dockerfile.python
            imports: gunicorn tos uvicorn
            keep_rollback: true
          - tag: '3.12'
            dockerfile: Dockerfile.python-3.12
            imports: gunicorn playwright.sync_api tos uvicorn
          - tag: latest
            dockerfile: Dockerfile.python.latest
            imports: celery httpx2 pydantic_settings

    env:
      LOCAL_IMAGE: python-ci:${{ matrix.tag }}
      PYTHON_TAG: ${{ matrix.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: python
          tags: type=raw,value=${{ matrix.tag }}

      - name: Build Python image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ env.LOCAL_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ github.event_name != 'pull_request' }}
          load: true
          cache-from: type=gha,scope=python-${{ matrix.tag }}
          cache-to: type=gha,scope=python-${{ matrix.tag }},mode=max,ignore-error=true
          provenance: false
          sbom: false

      - name: Verify Python version and dependencies
        env:
          EXTRA_IMPORTS: ${{ matrix.imports }}
        run: |
          docker run --rm -i --network none -e PYTHON_TAG -e EXTRA_IMPORTS "$LOCAL_IMAGE" python - <<'PY'
          import importlib
          import os
          import subprocess
          import sys

          expected = os.environ["PYTHON_TAG"]
          actual = f"{sys.version_info.major}.{sys.version_info.minor}"
          if expected != "latest" and actual != expected:
              raise SystemExit(f"Expected Python {expected}, got {actual}")

          subprocess.run([sys.executable, "-m", "pip", "check"], check=True)
          for module in ["oss2", "httpx", "PIL", "pydantic", "redis", "requests", *os.environ["EXTRA_IMPORTS"].split()]:
              importlib.import_module(module)
          PY

      - name: Publish tested image to ACR
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.NAMESPACE }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          KEEP_ROLLBACK: ${{ matrix.keep_rollback && 'true' || 'false' }}
        run: |
          : "${REGISTRY:?Missing REGISTRY}" "${NAMESPACE:?Missing NAMESPACE}" "${USERNAME:?Missing USERNAME}" "${PASSWORD:?Missing PASSWORD}"
          printf '%s' "$PASSWORD" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin
          trap 'docker logout "$REGISTRY" >/dev/null' EXIT

          repository="$REGISTRY/$NAMESPACE/python"
          release="$repository:$PYTHON_TAG"
          build="$repository:$PYTHON_TAG-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$LOCAL_IMAGE" "$build"
          docker push "$build"
          digest=$(docker buildx imagetools inspect "$build" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The published build has no valid manifest digest"
            exit 1
          fi

          if [[ "$KEEP_ROLLBACK" == true ]]; then
            previous=$(docker buildx imagetools inspect "$release" --format '{{.Manifest.Digest}}')
            if [[ ! "$previous" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The current release has no valid manifest digest"
              exit 1
            fi
            rollback="$release-rollback-${previous#sha256:}"
            docker buildx imagetools create --prefer-index=false --tag "$rollback" "$repository@$previous"
            if [[ "$(docker buildx imagetools inspect "$rollback" --format '{{.Manifest.Digest}}')" != "$previous" ]]; then
              echo "::error::The rollback tag does not match the current release digest"
              exit 1
            fi
          fi

          docker buildx imagetools create --prefer-index=false --tag "$release" "$repository@$digest"
          if [[ "$(docker buildx imagetools inspect "$release" --format '{{.Manifest.Digest}}')" != "$digest" ]]; then
            echo "::error::The release tag does not match the tested build digest"
            exit 1
          fi

          {
            printf 'Published tag: `%s`\n\nBuild tag: `%s`\n\nDigest: `%s`\n' "$release" "$build" "$digest"
            if [[ "$KEEP_ROLLBACK" == true ]]; then
              printf '\nRollback: `%s` at `%s`\n' "$rollback" "$previous"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
