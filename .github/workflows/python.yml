name: Python Build

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/promote-acr-image/**'
      - '.github/workflows/python.yml'
      - 'python/**'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Python ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: python-${{ matrix.tag }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: '3.9'
            dockerfile: Dockerfile.python-3.9
            keep_rollback: true
          - tag: '3.10'
            dockerfile: Dockerfile.python
            keep_rollback: true
          - tag: '3.12'
            dockerfile: Dockerfile.python-3.12
          - tag: latest
            dockerfile: Dockerfile.python.latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: python
          tags: type=raw,value=${{ matrix.tag }}

      - name: Prepare ACR image references
        if: github.event_name != 'pull_request'
        id: acr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          NAMESPACE: ${{ secrets.NAMESPACE }}
          PYTHON_TAG: ${{ matrix.tag }}
        with:
          script: |
            const { REGISTRY, NAMESPACE, PYTHON_TAG, GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT } = process.env;
            if (!REGISTRY?.trim() || !NAMESPACE?.trim()) {
              throw new Error('REGISTRY and NAMESPACE secrets are required');
            }
            const repository = `${REGISTRY}/${NAMESPACE}/python`;
            core.setOutput('repository', repository);
            core.setOutput('candidate', `${repository}:${PYTHON_TAG}-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}`);

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request'
        uses: aliyun/acr-login@1840dbaffb41a83ec8ce19d5c1088e8776eb9bc3 # v2.0.3
        with:
          login-server: ${{ secrets.REGISTRY }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build, test and push candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./python
          file: ./python/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ github.event_name == 'pull_request' && format('python-ci:{0}', matrix.tag) || steps.acr.outputs.candidate }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ github.event_name != 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=python-${{ matrix.tag }}
          cache-to: type=gha,scope=python-${{ matrix.tag }},mode=max,ignore-error=true
          provenance: false
          sbom: false

      - name: Promote tested image in ACR
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/promote-acr-image
        with:
          repository: ${{ steps.acr.outputs.repository }}
          candidate: ${{ steps.acr.outputs.candidate }}
          tag: ${{ matrix.tag }}
          digest: ${{ steps.build.outputs.digest }}
          rollback: ${{ matrix.keep_rollback && 'true' || 'false' }}
