name: Python Build

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        required: true
        default: acr
        type: choice
        options:
          - acr
          - tcr
  pull_request:
    paths:
      - '.github/workflows/python.yml'
      - 'python/**'

permissions:
  contents: read

env:
  REGISTRY: ${{ inputs.registry == 'tcr' && vars.TCR_REGISTRY || inputs.registry != 'tcr' && secrets.REGISTRY || '' }}
  NAMESPACE: ${{ inputs.registry == 'tcr' && vars.TCR_NAMESPACE || inputs.registry != 'tcr' && secrets.NAMESPACE || '' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Python ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency: python-${{ matrix.tag }}-${{ github.ref }}-${{ inputs.registry || 'acr' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: '3.9'
            dockerfile: Dockerfile.python-3.9
          - tag: '3.10'
            dockerfile: Dockerfile.python
          - tag: '3.12'
            dockerfile: Dockerfile.python-3.12
          - tag: latest
            dockerfile: Dockerfile.python.latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: python
          tags: type=raw,value=${{ matrix.tag }}

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request' && inputs.registry != 'tcr' && env.REGISTRY != ''
        uses: aliyun/acr-login@1840dbaffb41a83ec8ce19d5c1088e8776eb9bc3 # v2.0.3
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Log in to Tencent Cloud TCR
        if: github.event_name == 'workflow_dispatch' && inputs.registry == 'tcr' && env.REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push Python image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./python
          file: ./python/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ github.event_name != 'pull_request' && format('{0}/{1}/python:{2}', env.REGISTRY, env.NAMESPACE, matrix.tag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ github.event_name != 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=python-${{ matrix.tag }}
          cache-to: type=gha,scope=python-${{ matrix.tag }},mode=max,ignore-error=true
          provenance: false
          sbom: false
