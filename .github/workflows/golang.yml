name: Golang Build

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron:  '30 5 * * 1,4'
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to
        required: true
        default: acr
        type: choice
        options:
          - acr
          - tcr

env:
  REGISTRY: ${{ inputs.registry == 'tcr' && vars.TCR_REGISTRY || inputs.registry != 'tcr' && secrets.REGISTRY || '' }}
  USERNAME: ${{ secrets.USERNAME }}
  NAMESPACE: ${{ inputs.registry == 'tcr' && vars.TCR_NAMESPACE || inputs.registry != 'tcr' && secrets.NAMESPACE || '' }}
  # github.repository as <account>/<repo>
  IMAGE_NAME: golang


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request' && inputs.registry != 'tcr' && env.REGISTRY != ''
        uses: aliyun/acr-login@1840dbaffb41a83ec8ce19d5c1088e8776eb9bc3 # v2.0.3
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Log in to Tencent Cloud TCR
        if: github.event_name == 'workflow_dispatch' && inputs.registry == 'tcr' && env.REGISTRY != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./golang
          file: ./golang/Dockerfile.golang
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
